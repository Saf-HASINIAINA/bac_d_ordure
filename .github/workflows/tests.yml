name: Tests

# Lance les tests à chaque Pull Request et à chaque push sur main.
# Aucune base de données n'est nécessaire : les tests utilisent des doublures (Mockito, MockMvc).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compiler et tester
        run: mvn -B -ntp verify
      - name: Rapports de tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-surefire
          path: target/surefire-reports
          retention-days: 7
