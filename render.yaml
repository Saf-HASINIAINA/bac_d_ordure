# Déploiement sur Render (offre gratuite) : voir docs/07_deploiement.md, section « Hébergeur gratuit ».
# Les valeurs marquées « sync: false » sont saisies dans le tableau de bord Render, jamais dans ce fichier.
services:
  - type: web
    name: ramassage-tulear
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /login.html
    autoDeploy: true
    envVars:
      - key: PORT                      # port d'écoute de l'application (Render route le trafic vers lui)
        value: "8080"
      - key: DB_URL                    # Supabase > Connect > Session pooler, au format jdbc:postgresql://...
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: SERVER_SERVLET_SESSION_COOKIE_SECURE   # HTTPS fourni par Render : cookie de session réservé à HTTPS
        value: "true"
      - key: SERVER_FORWARD_HEADERS_STRATEGY        # derrière le proxy Render : vraie adresse IP et protocole
        value: framework
      - key: JAVA_TOOL_OPTIONS                      # 512 Mo de mémoire sur l'offre gratuite
        value: "-XX:MaxRAMPercentage=70 -XX:+UseSerialGC -Xss512k"
