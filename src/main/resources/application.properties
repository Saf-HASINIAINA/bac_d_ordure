spring.application.name=ramassage-tulear

# Fuseau horaire utilisé pour découper les rapports par jour
app.fuseau=Indian/Antananarivo

# Variables lues dans l'environnement ou dans un fichier .env (non versionné)
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
# Regroupe les insertions JDBC en une seule requête réseau (base distante)
spring.datasource.hikari.data-source-properties.reWriteBatchedInserts=true

# Le schéma est géré UNIQUEMENT par les migrations Supabase : Hibernate ne fait que vérifier
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_updates=true

# Simulation du matériel
simulation.actif=true
# Intervalle entre deux séries de mesures (30 s : ménage la base gratuite ; 5000 pour une démo)
simulation.intervalle-ms=30000
simulation.facteur-vitesse=1.0
simulation.taux-perte=0.05
# Les mesures plus anciennes sont supprimées automatiquement
simulation.retention-jours=2

# Données de démonstration (zones, camions, bacs, utilisateurs) créées au démarrage si les tables sont vides
app.init-demo=false
app.demo-password=${DEMO_PASSWORD:}
# Réinitialise le mot de passe des 3 comptes de démo (avec app.init-demo=true)
app.reset-demo-passwords=false

# Session : cookie inaccessible au JavaScript, non envoyé depuis un autre site
# (passer server.servlet.session.cookie.secure=true derrière HTTPS)
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Planification des tournées : plus-proche-voisin ou priorite-remplissage
tournee.strategie=plus-proche-voisin
# Dépôt des camions (point de départ et de retour)
tournee.depot-latitude=-23.3550
tournee.depot-longitude=43.6700
