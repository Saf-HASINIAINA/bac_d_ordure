spring.application.name=ramassage-tulear

# Variables lues dans l'environnement ou dans un fichier .env (non versionné)
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5

# Le schéma est géré UNIQUEMENT par les migrations Supabase : Hibernate ne fait que vérifier
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Simulation du matériel
simulation.actif=true
simulation.intervalle-ms=5000
simulation.facteur-vitesse=1.0
simulation.taux-perte=0.05

# Données de démonstration (zones, camions, bacs, utilisateurs) créées au démarrage si les tables sont vides
app.init-demo=false
app.demo-password=${DEMO_PASSWORD:}
