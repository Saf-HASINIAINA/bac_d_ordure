<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ramassage des ordures - Tuléar</title>
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <aside class="barre" id="barre" aria-label="Navigation principale">
      <div class="barre-marque">
        <span class="barre-logo" aria-hidden="true">♻</span>
        <div><strong>Ramassage</strong><span>Commune de Tuléar</span></div>
      </div>
      <nav class="barre-nav" id="nav" aria-label="Menu"></nav>
      <div class="barre-pied" id="barre-pied" hidden>
        <div class="barre-utilisateur">
          <span class="barre-nom" id="utilisateur-nom"></span>
          <span class="badge role" id="utilisateur-role"></span>
        </div>
        <a class="barre-lien" href="#/compte" data-page="compte"><span class="icone" aria-hidden="true">👤</span><span class="barre-texte">Mon compte</span></a>
        <button type="button" class="barre-lien" id="bouton-deconnexion"><span class="icone" aria-hidden="true">⎋</span><span class="barre-texte">Se déconnecter</span></button>
      </div>
    </aside>
    <div class="barre-voile" id="voile" hidden></div>

    <div class="contenu">
      <header class="haut">
        <button type="button" class="menu-bouton" id="menu-bouton" aria-label="Ouvrir le menu" aria-expanded="false" aria-controls="barre">☰</button>
        <h1 id="titre-page">Ramassage des ordures</h1>
        <div class="connexion" id="connexion" role="status">
          <span class="point"></span>
          <span id="connexion-texte">Connexion…</span>
        </div>
      </header>
      <p class="message" id="message" role="status" aria-live="polite"></p>
      <main id="page" tabindex="-1"></main>
    </div>
  </div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="vendor/chartjs/chart.umd.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
