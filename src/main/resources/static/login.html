<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion - Ramassage des ordures</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-auth">
  <main class="auth">
    <h1>Ramassage des bacs d'ordures</h1>
    <p class="sous-titre">Commune Urbaine de Tuléar</p>

    <form class="auth-formulaire" id="form-connexion" novalidate>
      <h2>Connexion</h2>
      <label>Adresse e-mail
        <input type="email" id="email" name="email" autocomplete="username" required autofocus>
      </label>
      <label>Mot de passe
        <input type="password" id="motDePasse" name="motDePasse" autocomplete="current-password" required>
      </label>
      <p class="message" id="message" role="alert" aria-live="assertive"></p>
      <button type="submit" class="bouton principal">Se connecter</button>
      <p class="auth-lien">Pas encore de compte ? <a href="inscription.html">S'inscrire</a></p>
    </form>
  </main>
  <script type="module" src="js/connexion.js"></script>
</body>
</html>
