# Déploiement de démonstration : base PostgreSQL + migrations + application, en une commande.
#   cp .env.docker.example .env.docker      (puis choisir les mots de passe)
#   docker compose --env-file .env.docker up --build
# L'application est alors sur http://localhost:${APP_PORT:-8080} (voir docs/07_deploiement.md).

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ramassage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définir POSTGRES_PASSWORD dans .env.docker}
    volumes:
      - donnees-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ramassage"]
      interval: 5s
      timeout: 5s
      retries: 10

  migration:
    image: postgres:15-alpine
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGDATABASE: ramassage
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./supabase/migrations:/migrations:ro
      - ./docker/migrer.sh:/migrer.sh:ro
    entrypoint: ["sh", "/migrer.sh"]
    restart: "no"

  app:
    build: .
    depends_on:
      migration:
        condition: service_completed_successfully
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/ramassage
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      # zones, camions, bacs et comptes de démo créés au premier démarrage (rien si les tables sont remplies)
      APP_INIT_DEMO: "true"
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
    restart: unless-stopped

volumes:
  donnees-db:
